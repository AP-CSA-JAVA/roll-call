<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Questions</title>
<script>try{var __t=JSON.parse(localStorage.getItem('rc_theme')||'null'); if(__t) document.documentElement.setAttribute('data-theme', __t);}catch(e){}</script>
<script src="course-questions.js"></script>
<script src="live.js"></script>
<style>
  /* Same six themes as Roll Call. */
  :root{ --bg:#16241c; --panel:#1f3d2e; --raised:#274a38; --chalk:#f2efe3; --chalk-dim:#b9c4ba; --rule:#3a5b47; --yellow:#e8b923; --on-accent:#1a1206; --green:#7fb37a; --red:#d9694f; color-scheme:dark; }
  :root[data-theme="midnight"]{ --bg:#0f1a2b; --panel:#172a45; --raised:#1e3558; --chalk:#eef2f8; --chalk-dim:#aab7cb; --rule:#2c4a74; --yellow:#6cc4ff; --on-accent:#06202f; --green:#6fcf97; --red:#ff7a66; }
  :root[data-theme="charcoal"]{ --bg:#1a1a1c; --panel:#28282b; --raised:#323236; --chalk:#f1efea; --chalk-dim:#b5b3ad; --rule:#46464b; --yellow:#ff8f3f; --on-accent:#1f1004; --green:#8bc48a; --red:#f0705a; }
  :root[data-theme="plum"]{ --bg:#1d1426; --panel:#2e2040; --raised:#3a2952; --chalk:#f4eef8; --chalk-dim:#c3b6d0; --rule:#56406f; --yellow:#f3c969; --on-accent:#231803; --green:#8fd19e; --red:#ff7f8a; }
  :root[data-theme="teal"]{ --bg:#0e2426; --panel:#15393c; --raised:#1b4a4e; --chalk:#eef7f5; --chalk-dim:#a9c4c1; --rule:#2f6367; --yellow:#ff9e7a; --on-accent:#2a1005; --green:#7fd1a0; --red:#ff8a72; }
  :root[data-theme="paper"]{ --bg:#f3efe4; --panel:#ffffff; --raised:#ece6d6; --chalk:#1d2a23; --chalk-dim:#56635b; --rule:#d6cfbc; --yellow:#1f6b47; --on-accent:#ffffff; --green:#237a3b; --red:#b8412c; color-scheme:light; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--chalk); font-family:'Space Grotesk', ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; padding:24px 16px 60px; }
  .wrap{ max-width:820px; margin:0 auto; }
  header{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  h1{ margin:0; font-size:24px; } h1 span{ color:var(--yellow); }
  .who{ color:var(--chalk-dim); font-size:14px; }
  .who button{ background:none; border:none; color:var(--chalk-dim); text-decoration:underline; cursor:pointer; font:inherit; }
  .card{ background:var(--panel); border:1.5px solid var(--rule); border-radius:14px; padding:22px; }
  .big{ font-size:20px; line-height:1.4; }
  .dim{ color:var(--chalk-dim); }
  label{ display:block; margin:0 0 6px; color:var(--chalk-dim); font-size:14px; }
  input[type=text]{ width:100%; max-width:320px; padding:12px; font:inherit; font-size:18px; border-radius:10px; border:1.5px solid var(--rule); background:var(--bg); color:var(--chalk); }
  .btn{ background:var(--yellow); color:var(--on-accent); border:none; border-radius:10px; padding:12px 20px; font:inherit; font-size:16px; font-weight:700; cursor:pointer; }
  .btn:disabled{ opacity:.45; cursor:not-allowed; }
  .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
  .err{ color:var(--red); margin-top:10px; min-height:1.2em; }
  .qtext{ font-size:21px; line-height:1.45; margin-bottom:14px; }
  .choices{ display:grid; gap:10px; }
  .choice{ display:flex; gap:12px; align-items:flex-start; text-align:left; width:100%; background:var(--raised); color:var(--chalk); border:2px solid var(--rule); border-radius:12px; padding:14px 16px; font:inherit; font-size:18px; cursor:pointer; }
  .choice .letter{ flex:none; width:1.8em; height:1.8em; border-radius:8px; background:var(--rule); display:flex; align-items:center; justify-content:center; font-weight:800; }
  .choice .ctext{ white-space:pre-wrap; padding-top:.15em; }
  .choice.sel{ border-color:var(--yellow); } .choice.sel .letter{ background:var(--yellow); color:var(--on-accent); }
  .choice:disabled{ cursor:default; }
  .choice.right{ border-color:var(--green); } .choice.right .letter{ background:var(--green); color:#062010; }
  .choice.wrong{ border-color:var(--red); } .choice.wrong .letter{ background:var(--red); color:#2a0505; }
  .banner{ margin-top:16px; padding:12px 16px; border-radius:10px; background:var(--raised); font-weight:700; font-size:18px; }
  .banner.good{ color:var(--green); } .banner.bad{ color:var(--red); }
  .tally{ margin-top:14px; color:var(--chalk-dim); font-size:14px; }
  .pulse{ display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--yellow); margin-right:8px; animation:p 1.4s infinite; }
  @keyframes p{ 0%,100%{ opacity:.25 } 50%{ opacity:1 } }
  footer{ margin-top:36px; text-align:center; color:var(--chalk-dim); font-size:12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Live <span>Questions</span></h1>
    <div class="who" id="who" hidden></div>
  </header>

  <!-- sign in -->
  <div class="card" id="signin">
    <p class="big" style="margin-top:0;">Sign in with your Student ID.</p>
    <label for="sid">Student ID</label>
    <input type="text" id="sid" inputmode="numeric" autocomplete="off">
    <div class="row"><button class="btn" id="go" type="button">Join</button></div>
    <div class="err" id="err"></div>
  </div>

  <!-- live view -->
  <div class="card" id="live" hidden>
    <div id="view"></div>
    <div class="tally" id="tally"></div>
  </div>

  <footer>ap-csa-java</footer>
</div>

<script>
(function(){
  "use strict";
  var me = null;            // { id, name, period }
  var cur = { seq: -1, picked: null, sending: false };
  var score = {};           // seq -> true/false, for "x of y right" this session
  var sessionName = "";
  var pollTimer = null;
  var LETTERS = "ABCDEFGHIJ";
  var KEY = "live_student";

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
  function textHtml(q, s){ return q.fmt === "md" && window.CourseQuestions ? CourseQuestions.inline(s) : esc(s); }
  function promptHtml(q){
    if (q.fmt === "md" && window.CourseQuestions) return CourseQuestions.promptHtml({ prompt: q.prompt, code: q.code });
    return esc(q.prompt) + (q.code ? '<pre class="cq-pre">' + esc(q.code) + "</pre>" : "");
  }

  // ---- sign in (kept for this browser tab only, so the next class on a shared laptop starts fresh) ----
  function showSignedIn(){
    $("signin").hidden = true; $("live").hidden = false;
    $("who").hidden = false;
    $("who").innerHTML = esc(me.name) + " · Period " + esc(me.period) + ' · <button type="button" id="out">Not you?</button>';
    $("out").addEventListener("click", function(){
      try { sessionStorage.removeItem(KEY); } catch(e){}
      location.reload();
    });
    poll();
  }
  function join(){
    var id = $("sid").value.trim();
    $("err").textContent = "";
    if(!id){ $("err").textContent = "Type your Student ID."; return; }
    $("go").disabled = true;
    Live.post("join", { id: id }).then(function(r){
      if(!r.ok){ $("err").textContent = r.error === "not-on-roster" ? "That ID isn't on the class list. Check it and try again." : "Something went wrong. Try again."; return; }
      me = { id: id, name: r.name, period: r.period };
      try { sessionStorage.setItem(KEY, JSON.stringify(me)); } catch(e){}
      showSignedIn();
    }).catch(function(){ $("err").textContent = "Couldn't connect. Check the internet and try again."; })
      .then(function(){ $("go").disabled = false; });
  }
  $("go").addEventListener("click", join);
  $("sid").addEventListener("keydown", function(e){ if(e.key === "Enter") join(); });

  // ---- polling ----
  function schedule(){
    clearTimeout(pollTimer);
    // a little random spread so 30 laptops don't all ask at the same moment
    pollTimer = setTimeout(poll, Live.config.studentPollMs + Math.floor(Math.random() * 800));
  }
  function poll(){
    Live.post("poll", { id: me.id }).then(render).catch(function(){
      setNote("Reconnecting…");
    }).then(schedule);
  }
  function setNote(t){
    if(!cur.q) $("view").innerHTML = '<p class="big dim"><span class="pulse"></span>' + esc(t) + "</p>";
  }

  function render(s){
    if(!s.ok){ if(s.error === "not-on-roster"){ $("view").innerHTML = '<p class="big">Your ID is no longer on the class list. Ask your teacher.</p>'; } return; }
    if(!s.active){
      cur = { seq: -1, picked: null, sending: false };
      $("view").innerHTML = '<p class="big dim"><span class="pulse"></span>Waiting for your teacher to start…</p>';
      $("tally").textContent = "";
      return;
    }
    if(s.session !== sessionName){ sessionName = s.session; score = {}; }
    if(!s.q){
      $("view").innerHTML = '<p class="big dim"><span class="pulse"></span>Get ready — the first question is coming.</p>';
      return;
    }
    var fresh = s.seq !== cur.seq;
    if(fresh) cur = { seq: s.seq, picked: null, sending: false, q: s.q };
    if(s.revealed && s.answered != null) score[s.seq] = !!s.right;
    var answered = s.answered != null;
    // Only redraw when something changed, so a half-made choice isn't wiped.
    var sig = s.seq + "|" + (answered ? s.answered : "-") + "|" + (s.revealed ? 1 : 0) + "|" + cur.picked + "|" + cur.sending;
    if(sig === cur.sig) return;
    cur.sig = sig;

    var h = '<div class="qtext">' + promptHtml(s.q) + "</div><div class=\"choices\">";
    s.q.choices.forEach(function(c, i){
      var cls = "choice";
      if(s.revealed){ if(i === s.correct) cls += " right"; else if(answered && i === s.answered) cls += " wrong"; }
      else if(answered ? i === s.answered : i === cur.picked) cls += " sel";
      h += '<button type="button" class="' + cls + '" data-i="' + i + '"' + (answered || s.revealed ? " disabled" : "") + '>' +
           '<span class="letter">' + LETTERS.charAt(i) + '</span><span class="ctext">' + textHtml(s.q, c) + "</span></button>";
    });
    h += "</div>";
    if(s.revealed){
      if(!answered) h += '<div class="banner bad">You didn\'t answer this one.</div>';
      else h += s.right ? '<div class="banner good">✓ Correct!</div>' : '<div class="banner bad">Not this time. The answer was ' + LETTERS.charAt(s.correct) + ".</div>";
    } else if(answered){
      h += '<div class="banner">Locked in: ' + LETTERS.charAt(s.answered) + '. Wait for your teacher to reveal the answer.</div>';
    } else {
      h += '<div class="row"><button class="btn" id="submit" type="button"' + (cur.picked == null || cur.sending ? " disabled" : "") + '>' +
           (cur.sending ? "Sending…" : "Submit answer") + "</button><span class=\"dim\">You get one answer per question.</span></div>";
    }
    $("view").innerHTML = h;
    if(!answered && !s.revealed){
      Array.prototype.forEach.call($("view").querySelectorAll(".choice"), function(b){
        b.addEventListener("click", function(){ cur.picked = Number(b.getAttribute("data-i")); render(s); });
      });
      var sub = $("submit");
      if(sub) sub.addEventListener("click", function(){ submit(s); });
    }
    var keys = Object.keys(score), right = keys.filter(function(k){ return score[k]; }).length;
    $("tally").textContent = keys.length ? "This session: " + right + " of " + keys.length + " right" : "";
  }

  function submit(s){
    if(cur.picked == null || cur.sending) return;
    cur.sending = true; render(s);
    Live.post("answer", { id: me.id, seq: s.seq, choice: cur.picked }).then(function(r){
      cur.sending = false;
      if(r.ok){ s.answered = r.answered; }
      else if(r.error === "closed"){ alert("Too late — the answer was already revealed."); }
      else if(r.error === "old-question"){ /* a new question arrived; the next poll shows it */ }
      render(s);
      poll();
    }).catch(function(){
      cur.sending = false; render(s);
      alert("Couldn't send your answer. Check the internet and press Submit again.");
    });
  }

  // ---- start ----
  try { me = JSON.parse(sessionStorage.getItem(KEY) || "null"); } catch(e){ me = null; }
  if(me && me.id) showSignedIn(); else $("sid").focus();
})();
</script>
</body>
</html>
